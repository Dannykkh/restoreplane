name: Production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version without the v prefix
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_MSRV: "1.91.0"
  RUST_TOOLCHAIN: "1.97.0"
  NODE_VERSION: "24"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  quality:
    name: Current-build quality and G5 contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - name: MSRV check
        run: cargo +${{ env.RUST_MSRV }} check --workspace --all-targets --locked
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/console
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend tests
        run: npm test --prefix apps/console
      - name: Frontend production build
        run: npm run build --prefix apps/console
      - name: Installer lifecycle contracts
        shell: powershell
        run: .\scripts\tests\install-lifecycle.Tests.ps1
      - name: Native tool package contracts
        shell: powershell
        run: .\scripts\tests\native-tool-package.Tests.ps1
      - name: Provider certification contracts
        shell: powershell
        run: .\scripts\tests\provider-certifications.Tests.ps1
      - name: Exact signed artifact evidence contracts
        shell: powershell
        run: .\scripts\tests\artifact-functional-evidence.Tests.ps1
      - name: Installed artifact functional harness contracts
        shell: powershell
        run: .\scripts\tests\signed-artifact-functional.Tests.ps1
      - name: Selective scope pipeline contracts
        shell: powershell
        run: .\scripts\tests\test-selective-scopes.Tests.ps1
      - name: Release matrix contracts
        shell: powershell
        run: .\scripts\tests\test-release-matrix.Tests.ps1
      - name: Release policy and action pinning
        shell: powershell
        run: .\scripts\tests\check-release-policy.Tests.ps1
      - name: Automated G5 release matrix
        shell: powershell
        run: .\scripts\test-release-matrix.ps1
      - name: Upload G5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g5-evidence-${{ github.run_id }}
          path: artifacts/g5
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: SBOM, dependency, license, and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install exact supply-chain tools
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Generate Rust CycloneDX SBOMs
        shell: bash
        run: |
          mkdir -p artifacts/supply-chain
          cargo cyclonedx --format json --target all
          find . -name '*.cdx.json' -not -path "./target/*" -print \
            | LC_ALL=C sort > artifacts/supply-chain/rust-sbom-files.txt
          test -s artifacts/supply-chain/rust-sbom-files.txt
          tar -czf artifacts/supply-chain/rust-sbom.tar.gz \
            -T artifacts/supply-chain/rust-sbom-files.txt
      - name: Rust advisory audit
        shell: bash
        run: cargo audit --json > artifacts/supply-chain/cargo-audit.json
      - name: Rust dependency and license policy
        shell: bash
        run: cargo deny check 2>&1 | tee artifacts/supply-chain/cargo-deny.txt
      - name: Generate and audit frontend SBOM
        shell: bash
        run: |
          npm ci --prefix apps/console
          npm --prefix apps/console audit --omit=dev --audit-level=high \
            --json > artifacts/supply-chain/npm-audit.json
          npm --prefix apps/console sbom --sbom-format cyclonedx \
            > artifacts/supply-chain/console.cdx.json
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ github.run_id }}
          path: artifacts/supply-chain
          if-no-files-found: error
          retention-days: 90

  managed-evidence:
    name: G0-G4 same-source managed restore evidence
    runs-on: [self-hosted, windows, x64, dbbackup-managed]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Prepare managed runner
        shell: powershell
        run: |
          docker version
          npm ci --prefix apps/console
          Push-Location apps/console
          try {
            npx playwright install chromium
          } finally {
            Pop-Location
          }
      - name: Run G0-G5 release matrix with managed fixtures
        shell: powershell
        run: >
          .\scripts\test-release-matrix.ps1
          -RunManaged
          -RequireUpstreamEvidence
      - name: Upload same-source release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-release-evidence-${{ github.run_id }}
          path: |
            artifacts/g0
            artifacts/g1
            artifacts/g2
            artifacts/g3-b
            artifacts/g4
            artifacts/g5
          if-no-files-found: error
          retention-days: 90

  native_tool_bundle:
    name: Validate pre-audited native database tools
    runs-on: [self-hosted, windows, x64, dbbackup-managed]
    environment: production-signing
    outputs:
      audit_sha256: ${{ steps.stage.outputs.audit_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stage audited PG18, MySQL8, and MariaDB11 clients
        id: stage
        shell: powershell
        env:
          NATIVE_TOOL_ROOT: ${{ vars.AUDITED_NATIVE_TOOL_ROOT }}
          NATIVE_TOOL_AUDIT_SHA256: ${{ vars.AUDITED_NATIVE_TOOL_AUDIT_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NATIVE_TOOL_ROOT) -or
              $env:NATIVE_TOOL_AUDIT_SHA256 -notmatch "^[0-9a-fA-F]{64}$") {
            throw "RELEASE_AUDITED_NATIVE_TOOL_INPUT_MISSING"
          }
          $outputRoot = [IO.Path]::GetFullPath("artifacts\native-tool-input")
          $result = .\scripts\stage-native-tools.ps1 `
            -NativeToolRoot $env:NATIVE_TOOL_ROOT `
            -PackageRoot $outputRoot `
            -ExpectedAuditManifestSha256 $env:NATIVE_TOOL_AUDIT_SHA256 `
            -Channel production | ConvertFrom-Json
          if ($result.status -ne "staged" -or
              $result.auditManifestSha256 -ne
                $env:NATIVE_TOOL_AUDIT_SHA256.ToLowerInvariant()) {
            throw "RELEASE_AUDITED_NATIVE_TOOL_STAGE_FAILED"
          }
          "audit_sha256=$($result.auditManifestSha256)" >> $env:GITHUB_OUTPUT
      - name: Upload same-run audited native tool artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-tool-bundle-${{ github.run_id }}
          path: artifacts/native-tool-input
          if-no-files-found: error
          retention-days: 1

  signed-package:
    name: Build, Authenticode sign, and package
    needs: [quality, supply-chain, managed-evidence, native_tool_bundle]
    runs-on: windows-latest
    environment: production-signing
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      signer_thumbprint: ${{ steps.certificate.outputs.thumbprint }}
      build_id: ${{ steps.assemble.outputs.build_id }}
      source_tree_digest: ${{ steps.assemble.outputs.source_tree_digest }}
      artifact_id: ${{ steps.assemble.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-${{ github.run_id }}
          path: dist/release/sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-tool-bundle-${{ github.run_id }}
          path: dist/native-tool-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: managed-release-evidence-${{ github.run_id }}
          path: artifacts
      - name: Resolve and validate release version
        id: release-version
        shell: powershell
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            $env:DISPATCH_VERSION
          }
          $parsed = $null
          if (-not [Version]::TryParse($version, [ref] $parsed) -or
              $parsed.ToString(3) -ne $version) {
            throw "RELEASE_VERSION_INVALID"
          }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $workspaceVersions = @(
            $metadata.packages |
              Where-Object { $_.source -eq $null } |
              Select-Object -ExpandProperty version -Unique
          )
          if ($workspaceVersions.Count -ne 1 -or $workspaceVersions[0] -ne $version) {
            throw "RELEASE_VERSION_WORKSPACE_MISMATCH"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build service and CLI
        run: cargo build --release --locked -p dbbackup-service -p dbbackup-cli
      - name: Build provider evidence digest helper
        run: cargo build --release --locked -p dbbackup-pipeline --bin dbbackup-blake3
      - name: Import production certificate
        id: certificate
        shell: powershell
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)) {
            throw "RELEASE_SIGNING_CREDENTIALS_MISSING"
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "dbbackup-release.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          )
          $securePassword = ConvertTo-SecureString `
            $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePassword `
            -Exportable:$false
          Remove-Item -LiteralPath $pfxPath -Force
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
            throw "RELEASE_SIGNING_CERTIFICATE_INVALID"
          }
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = Get-ChildItem -LiteralPath $sdkRoot -Recurse `
            -Filter signtool.exe -File |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "RELEASE_SIGNTOOL_MISSING"
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "subject=$($certificate.Subject)" >> $env:GITHUB_OUTPUT
          "signtool=$($signTool.FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign and verify service binaries
        shell: powershell
        env:
          SIGNTOOL_PATH: ${{ steps.certificate.outputs.signtool }}
          SIGNER_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $files = @(
            "target\release\dbbackup-service.exe",
            "target\release\dbbackup.exe"
          )
          foreach ($file in $files) {
            & $env:SIGNTOOL_PATH sign /sha1 $env:SIGNER_THUMBPRINT `
              /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) {
              throw "RELEASE_SIGN_FAILED"
            }
            & $env:SIGNTOOL_PATH verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) {
              throw "RELEASE_SIGNATURE_VERIFY_FAILED"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid" -or
                $signature.SignerCertificate.Thumbprint -ne $env:SIGNER_THUMBPRINT) {
              throw "RELEASE_AUTHENTICODE_INVALID"
            }
          }
      - name: Build signed Tauri bundles
        shell: powershell
        env:
          SIGNER_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          npm ci --prefix apps/console
          $override = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:SIGNER_THUMBPRINT
                digestAlgorithm = "sha256"
                timestampUrl = "https://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 8
          $overridePath = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          [IO.File]::WriteAllText(
            $overridePath,
            $override,
            [Text.UTF8Encoding]::new($false)
          )
          Push-Location apps/console
          try {
            npm run tauri -- build --config $overridePath --bundles nsis,msi
          } finally {
            Pop-Location
          }
      - name: Verify signed Tauri bundles
        shell: powershell
        env:
          SIGNTOOL_PATH: ${{ steps.certificate.outputs.signtool }}
          SIGNER_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
        run: |
          $bundles = @(
            Get-ChildItem target\release\bundle -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".msi") }
          )
          if ($bundles.Count -lt 2) {
            throw "RELEASE_TAURI_BUNDLES_MISSING"
          }
          foreach ($bundle in $bundles) {
            & $env:SIGNTOOL_PATH verify /pa /all /v $bundle.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "RELEASE_TAURI_SIGNATURE_INVALID"
            }
          }
      - name: Assemble signed release artifact
        id: assemble
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          SIGNER_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          SIGNER_SUBJECT: ${{ steps.certificate.outputs.subject }}
          NATIVE_TOOL_AUDIT_SHA256: ${{ needs.native_tool_bundle.outputs.audit_sha256 }}
        run: |
          $qualificationPath = [IO.Path]::GetFullPath(
            "artifacts\g5\release-matrix.json"
          )
          $qualification = Get-Content -LiteralPath $qualificationPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($qualification.schemaVersion -ne 1 -or
              $qualification.gateId -ne "G5" -or
              $qualification.mode -ne "qualification" -or
              $qualification.status -ne "pass" -or
              $qualification.sourceRevision -ne $env:GITHUB_SHA -or
              $qualification.sourceTreeDigest -notmatch "^[0-9a-f]{64}$" -or
              $qualification.buildId -notmatch "^[0-9a-f]{64}$" -or
              $qualification.execution.managedRequested -ne $true -or
              $qualification.execution.upstreamRequired -ne $true -or
              @($qualification.upstreamEvidence |
                Where-Object { $_.status -ne "pass" }).Count -ne 0) {
            throw "RELEASE_QUALIFICATION_EVIDENCE_INVALID"
          }
          $buildId = [string] $qualification.buildId
          $sourceTreeDigest = [string] $qualification.sourceTreeDigest
          $releaseRoot = [IO.Path]::GetFullPath("dist\release")
          $packageRoot = Join-Path $releaseRoot "package"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item target\release\dbbackup-service.exe $packageRoot
          Copy-Item target\release\dbbackup.exe $packageRoot
          $nativeInputRoot = [IO.Path]::GetFullPath(
            "dist\native-tool-input\tools"
          )
          .\scripts\stage-native-tools.ps1 `
            -NativeToolRoot $nativeInputRoot `
            -PackageRoot $packageRoot `
            -ExpectedAuditManifestSha256 $env:NATIVE_TOOL_AUDIT_SHA256 `
            -Channel production | Out-Null
          .\scripts\new-provider-certifications.ps1 `
            -ExistingEnginesEvidencePath `
              artifacts\g2\existing-engines.json `
            -SelectiveScopeEvidencePath `
              artifacts\g2\selective-scopes.json `
            -OutputPath (Join-Path $packageRoot "provider-certifications.json") `
            -Blake3ExecutablePath `
              target\release\dbbackup-blake3.exe | Out-Null
          foreach ($directory in @("scripts", "installer", "config", "metadata", "console")) {
            New-Item -ItemType Directory `
              -Path (Join-Path $releaseRoot $directory) -Force | Out-Null
          }
          Copy-Item scripts\install.ps1,scripts\repair.ps1,scripts\update.ps1,`
            scripts\uninstall.ps1 -Destination (Join-Path $releaseRoot "scripts")
          Copy-Item installer\DbBackup.Install.Common.psm1 `
            -Destination (Join-Path $releaseRoot "installer")
          $certificate = Get-Item `
            -LiteralPath "Cert:\CurrentUser\My\$env:SIGNER_THUMBPRINT"
          $deploymentFiles = @(
            Get-ChildItem -LiteralPath (Join-Path $releaseRoot "scripts") `
              -Filter *.ps1 -File
          ) + @(
            Get-Item -LiteralPath (
              Join-Path $releaseRoot "installer\DbBackup.Install.Common.psm1"
            )
          )
          foreach ($deploymentFile in $deploymentFiles) {
            $signature = Set-AuthenticodeSignature `
              -LiteralPath $deploymentFile.FullName `
              -Certificate $certificate `
              -HashAlgorithm SHA256 `
              -TimestampServer https://timestamp.digicert.com
            if ($signature.Status -ne "Valid" -or
                $null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:SIGNER_THUMBPRINT) {
              throw "DEPLOYMENT_SCRIPT_SIGNATURE_INVALID"
            }
          }
          Copy-Item config\dbbackup.example.toml `
            -Destination (Join-Path $releaseRoot "config")
          Copy-Item release\*.json -Destination (Join-Path $releaseRoot "metadata")
          Copy-Item target\release\bundle\* `
            -Destination (Join-Path $releaseRoot "console") -Recurse
          .\scripts\new-package-manifest.ps1 `
            -PackageRoot $packageRoot `
            -OutputPath (Join-Path $packageRoot "package-manifest.json") `
            -Version $env:RELEASE_VERSION `
            -MinimumReaderVersion $env:RELEASE_VERSION `
            -BuildId $buildId `
            -Revision $env:GITHUB_SHA `
            -SourceTreeDigest $sourceTreeDigest `
            -Publisher $env:SIGNER_SUBJECT
          $packageManifestPath = Join-Path $packageRoot "package-manifest.json"
          $packageManifest = Get-Content -LiteralPath $packageManifestPath `
            -Raw -Encoding UTF8 | ConvertFrom-Json
          $serviceEntries = @($packageManifest.files | Where-Object {
              $_.path -eq "dbbackup-service.exe"
            })
          $cliEntries = @($packageManifest.files | Where-Object {
              $_.path -eq "dbbackup.exe"
            })
          if ($serviceEntries.Count -ne 1 -or $cliEntries.Count -ne 1) {
            throw "RELEASE_PACKAGE_REQUIRED_BINARY_MISSING"
          }
          $packageManifestSha256 = (
            Get-FileHash $packageManifestPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $serviceBinarySha256 = [string] $serviceEntries[0].sha256
          $cliBinarySha256 = [string] $cliEntries[0].sha256
          $artifactIdentityText = (
            "dbbackup-exact-artifact-v1`n" +
            "$packageManifestSha256`n" +
            "$serviceBinarySha256`n" +
            "$cliBinarySha256`n"
          )
          $artifactIdentitySha = [Security.Cryptography.SHA256]::Create()
          try {
            $artifactId = ([BitConverter]::ToString(
                $artifactIdentitySha.ComputeHash(
                  [Text.Encoding]::UTF8.GetBytes($artifactIdentityText)
                )
              )).Replace("-", "").ToLowerInvariant()
          } finally {
            $artifactIdentitySha.Dispose()
          }
          $signingMetadata = [ordered] @{
            schemaVersion = 1
            version = $env:RELEASE_VERSION
            sourceRevision = $env:GITHUB_SHA
            sourceTreeDigest = $sourceTreeDigest
            buildId = $buildId
            artifactId = $artifactId
            signerThumbprint = $env:SIGNER_THUMBPRINT
            signerSubject = $env:SIGNER_SUBJECT
            nativeToolAuditSha256 = $env:NATIVE_TOOL_AUDIT_SHA256
            timestampUrl = "https://timestamp.digicert.com"
            packageManifestSha256 = $packageManifestSha256
            serviceBinarySha256 = $serviceBinarySha256
            cliBinarySha256 = $cliBinarySha256
          }
          $signingMetadata | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $releaseRoot "signing-metadata.json") `
              -Encoding UTF8
          $checksums = Get-ChildItem $releaseRoot -Recurse -File |
            Where-Object { $_.Name -ne "checksums.sha256" } |
            ForEach-Object {
              $relative = $_.FullName.Substring($releaseRoot.Length).
                TrimStart("\", "/").
                Replace("\", "/")
              $hash = (
                Get-FileHash $_.FullName -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              "$hash  $relative"
            } |
            Sort-Object
          [IO.File]::WriteAllLines(
            (Join-Path $releaseRoot "checksums.sha256"),
            $checksums,
            [Text.UTF8Encoding]::new($false)
          )
          "build_id=$buildId" >> $env:GITHUB_OUTPUT
          "source_tree_digest=$sourceTreeDigest" >> $env:GITHUB_OUTPUT
          "artifact_id=$artifactId" >> $env:GITHUB_OUTPUT
      - name: Upload signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbbackup-signed-candidate-${{ github.run_id }}
          path: dist/release
          if-no-files-found: error
          retention-days: 1

  artifact-functional-qualification:
    name: Qualify exact installed signed artifact through service IPC
    needs: signed-package
    runs-on: [self-hosted, windows, x64, dbbackup-managed-artifact, ephemeral]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare protected artifact staging
        shell: powershell
        run: |
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $system = [Security.Principal.SecurityIdentifier]::new("S-1-5-18")
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          $acl.SetOwner($owner)
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor `
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          foreach ($sid in @($system, $owner)) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                $sid,
                [Security.AccessControl.FileSystemRights]::FullControl,
                $inheritance,
                [Security.AccessControl.PropagationFlags]::None,
                [Security.AccessControl.AccessControlType]::Allow
              ))
          }
          $staging = [IO.DirectoryInfo]::new(
            [IO.Path]::GetFullPath("artifact-candidate")
          )
          if ($staging.Exists) {
            throw "ARTIFACT_STAGING_NOT_PRISTINE"
          }
          $staging.Create($acl)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dbbackup-signed-candidate-${{ github.run_id }}
          path: artifact-candidate
      - name: Seal downloaded artifact staging
        shell: powershell
        run: |
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Import-Module .\installer\DbBackup.Install.Common.psm1 -Force
          Set-DbBackupProtectedAcl `
            -Path ([IO.Path]::GetFullPath("artifact-candidate")) `
            -OwnerSid $owner `
            -Recurse
          Assert-DbBackupProtectedAcl `
            -Path ([IO.Path]::GetFullPath("artifact-candidate")) `
            -OwnerSid $owner `
            -Recurse
      - name: Install and qualify exact signed candidate
        shell: powershell
        env:
          EXPECTED_SIGNER: ${{ needs.signed-package.outputs.signer_thumbprint }}
          EXPECTED_ARTIFACT_ID: ${{ needs.signed-package.outputs.artifact_id }}
          EXPECTED_BUILD_ID: ${{ needs.signed-package.outputs.build_id }}
          EXPECTED_SOURCE_TREE_DIGEST: ${{ needs.signed-package.outputs.source_tree_digest }}
          QUALIFICATION_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          .\scripts\test-signed-artifact-functional.ps1 `
            -ReleaseRoot artifact-candidate `
            -OutputRoot artifacts\artifact-functional `
            -ExpectedSignerThumbprint $env:EXPECTED_SIGNER `
            -ExpectedArtifactId $env:EXPECTED_ARTIFACT_ID `
            -ExpectedBuildId $env:EXPECTED_BUILD_ID `
            -ExpectedSourceTreeDigest $env:EXPECTED_SOURCE_TREE_DIGEST `
            -RunToken $env:QUALIFICATION_RUN_TOKEN
      - name: Assert managed fixture cleanup
        if: always()
        shell: powershell
        env:
          QUALIFICATION_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Stop"
          $token = $env:QUALIFICATION_RUN_TOKEN
          if ($env:RUNNER_ENVIRONMENT -ne "self-hosted" -or
              $env:DBBACKUP_ARTIFACT_RUNNER_EPHEMERAL -ne "1" -or
              $token -notmatch "^[0-9]+-[0-9]+$") {
            throw "ARTIFACT_FUNCTIONAL_EPHEMERAL_RUNNER_REQUIRED"
          }
          $short = $token.Replace("-", "")
          foreach ($container in @(
              "dbbackup-artifact-pg-$short",
              "dbbackup-artifact-mysql-$short",
              "dbbackup-artifact-maria-$short"
            )) {
            & docker inspect $container 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              throw "ARTIFACT_FUNCTIONAL_CONTAINER_CLEANUP_INCOMPLETE"
            }
          }
          if ($null -ne (Get-Service -Name "DbBackupService" `
                -ErrorAction SilentlyContinue)) {
            throw "ARTIFACT_FUNCTIONAL_SERVICE_CLEANUP_INCOMPLETE"
          }
          $fixtureRoot = [IO.Path]::GetFullPath((Join-Path (
              Join-Path ([IO.Path]::GetFullPath($env:RUNNER_TEMP)) `
                "DbBackupArtifactQualification"
            ) $token))
          if (Test-Path -LiteralPath $fixtureRoot) {
            throw "ARTIFACT_FUNCTIONAL_FILE_CLEANUP_INCOMPLETE"
          }
      - name: Upload exact artifact functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-functional-${{ github.run_id }}
          path: artifacts/artifact-functional
          if-no-files-found: error
          retention-days: 90

  clean-windows-fixture:
    name: Clean signed install, repair, update, support, and uninstall
    needs: signed-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare protected release staging
        shell: powershell
        run: |
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $system = [Security.Principal.SecurityIdentifier]::new("S-1-5-18")
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetAccessRuleProtection($true, $false)
          $acl.SetOwner($owner)
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor `
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          foreach ($sid in @($system, $owner)) {
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new(
                $sid,
                [Security.AccessControl.FileSystemRights]::FullControl,
                $inheritance,
                [Security.AccessControl.PropagationFlags]::None,
                [Security.AccessControl.AccessControlType]::Allow
              ))
          }
          $staging = [IO.DirectoryInfo]::new(
            [IO.Path]::GetFullPath("release-fixture")
          )
          if ($staging.Exists) {
            throw "RELEASE_STAGING_NOT_PRISTINE"
          }
          $staging.Create($acl)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dbbackup-signed-candidate-${{ github.run_id }}
          path: release-fixture
      - name: Seal downloaded release staging
        shell: powershell
        run: |
          $owner = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          Import-Module .\installer\DbBackup.Install.Common.psm1 -Force
          Set-DbBackupProtectedAcl `
            -Path ([IO.Path]::GetFullPath("release-fixture")) `
            -OwnerSid $owner `
            -Recurse
          Assert-DbBackupProtectedAcl `
            -Path ([IO.Path]::GetFullPath("release-fixture")) `
            -OwnerSid $owner `
            -Recurse
      - name: Exercise production Windows lifecycle
        shell: powershell
        env:
          EXPECTED_RELEASE_SIGNER: ${{ needs.signed-package.outputs.signer_thumbprint }}
          EXPECTED_RELEASE_BUILD_ID: ${{ needs.signed-package.outputs.build_id }}
          EXPECTED_SOURCE_TREE_DIGEST: ${{ needs.signed-package.outputs.source_tree_digest }}
        run: |
          $root = [IO.Path]::GetFullPath("release-fixture")
          $expectedSigner = $env:EXPECTED_RELEASE_SIGNER.Replace(" ", "").ToUpperInvariant()
          if ($expectedSigner -notmatch "^[0-9A-F]{40}$") {
            throw "RELEASE_FIXTURE_EXPECTED_SIGNER_INVALID"
          }
          $deploymentFiles = @(
            Get-ChildItem -LiteralPath (Join-Path $root "scripts") `
              -Filter *.ps1 -File
          ) + @(
            Get-Item -LiteralPath (
              Join-Path $root "installer\DbBackup.Install.Common.psm1"
            )
          )
          foreach ($deploymentFile in $deploymentFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $deploymentFile.FullName
            if ($signature.Status -ne "Valid" -or
                $null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint.Replace(" ", "").ToUpperInvariant() -ne
                  $expectedSigner) {
              throw "DEPLOYMENT_SCRIPT_SIGNATURE_INVALID"
            }
          }
          $metadata = Get-Content `
            -LiteralPath (Join-Path $root "signing-metadata.json") `
            -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($metadata.signerThumbprint.Replace(" ", "").ToUpperInvariant() -ne
              $expectedSigner) {
            throw "RELEASE_FIXTURE_METADATA_SIGNER_MISMATCH"
          }
          $package = Join-Path $root "package"
          $manifest = Join-Path $package "package-manifest.json"
          $manifestDocument = Get-Content -LiteralPath $manifest `
            -Raw -Encoding UTF8 | ConvertFrom-Json
          $serviceEntries = @($manifestDocument.files | Where-Object {
              $_.path -eq "dbbackup-service.exe"
            })
          $cliEntries = @($manifestDocument.files | Where-Object {
              $_.path -eq "dbbackup.exe"
            })
          if ($serviceEntries.Count -ne 1 -or $cliEntries.Count -ne 1) {
            throw "RELEASE_FIXTURE_REQUIRED_BINARY_MISSING"
          }
          $manifestSha256 = (
            Get-FileHash $manifest -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $serviceSha256 = (
            Get-FileHash (Join-Path $package "dbbackup-service.exe") `
              -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $cliSha256 = (
            Get-FileHash (Join-Path $package "dbbackup.exe") -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $artifactIdentityText = (
            "dbbackup-exact-artifact-v1`n" +
            "$manifestSha256`n" +
            "$serviceSha256`n" +
            "$cliSha256`n"
          )
          $artifactIdentitySha = [Security.Cryptography.SHA256]::Create()
          try {
            $calculatedArtifactId = ([BitConverter]::ToString(
                $artifactIdentitySha.ComputeHash(
                  [Text.Encoding]::UTF8.GetBytes($artifactIdentityText)
                )
              )).Replace("-", "").ToLowerInvariant()
          } finally {
            $artifactIdentitySha.Dispose()
          }
          if ($metadata.sourceRevision -ne $env:GITHUB_SHA -or
              $metadata.sourceTreeDigest -ne $env:EXPECTED_SOURCE_TREE_DIGEST -or
              $metadata.buildId -ne $env:EXPECTED_RELEASE_BUILD_ID -or
              $manifestDocument.revision -ne $metadata.sourceRevision -or
              $manifestDocument.sourceTreeDigest -ne $metadata.sourceTreeDigest -or
              $manifestDocument.buildId -ne $metadata.buildId -or
              $metadata.packageManifestSha256 -ne $manifestSha256 -or
              $metadata.serviceBinarySha256 -ne $serviceSha256 -or
              $metadata.cliBinarySha256 -ne $cliSha256 -or
              $metadata.artifactId -ne $calculatedArtifactId -or
              $serviceEntries[0].sha256 -ne $serviceSha256 -or
              $cliEntries[0].sha256 -ne $cliSha256) {
            throw "RELEASE_FIXTURE_BUILD_IDENTITY_MISMATCH"
          }
          $install = Join-Path $env:ProgramFiles "DbBackup"
          $data = Join-Path $env:ProgramData "DbBackup"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy AllSigned `
            -File (Join-Path $root "scripts\install.ps1") `
            -PackageRoot $package `
            -ManifestPath $manifest `
            -ExpectedPackageManifestSha256 $metadata.packageManifestSha256 `
            -ExpectedSignerThumbprint $expectedSigner `
            -ExpectedNativeToolAuditSha256 $metadata.nativeToolAuditSha256
          if ($LASTEXITCODE -ne 0) {
            throw "RELEASE_FIXTURE_INSTALL_FAILED"
          }
          $cli = Join-Path $install "dbbackup.exe"
          $health = & $cli service status | ConvertFrom-Json
          if ($health.success -ne $true -or
              $health.result.phase -ne "production_ready" -or
              $health.result.executionAuthority -ne "service" -or
              $health.result.claimsEnabled -ne $true) {
            throw "RELEASE_FIXTURE_CLEAN_INSTALL_AUTHORITY_FAILED"
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy AllSigned `
            -File (Join-Path $root "scripts\repair.ps1") `
            -PackageRoot $package `
            -ManifestPath $manifest `
            -ExpectedPackageManifestSha256 $metadata.packageManifestSha256 `
            -ExpectedSignerThumbprint $expectedSigner `
            -ExpectedNativeToolAuditSha256 $metadata.nativeToolAuditSha256
          if ($LASTEXITCODE -ne 0) {
            throw "RELEASE_FIXTURE_REPAIR_FAILED"
          }
          $support = & $cli service support-bundle | ConvertFrom-Json
          if ($support.success -ne $true) {
            throw "RELEASE_FIXTURE_SUPPORT_ENQUEUE_FAILED"
          }
          $deadline = [DateTimeOffset]::Now.AddSeconds(60)
          do {
            $bundles = @(
              Get-ChildItem (Join-Path $data "support-bundles") `
                -Filter *.tar.zst -File -ErrorAction SilentlyContinue
            )
            if ($bundles.Count -gt 0) {
              break
            }
            Start-Sleep -Milliseconds 500
          } while ([DateTimeOffset]::Now -lt $deadline)
          if ($bundles.Count -eq 0) {
            throw "RELEASE_FIXTURE_SUPPORT_BUNDLE_MISSING"
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy AllSigned `
            -File (Join-Path $root "scripts\update.ps1") `
            -PackageRoot $package `
            -ManifestPath $manifest `
            -ExpectedPackageManifestSha256 $metadata.packageManifestSha256 `
            -ExpectedSignerThumbprint $expectedSigner `
            -ExpectedNativeToolAuditSha256 $metadata.nativeToolAuditSha256
          if ($LASTEXITCODE -ne 0) {
            throw "RELEASE_FIXTURE_UPDATE_FAILED"
          }
          $health = & $cli service status | ConvertFrom-Json
          if ($health.success -ne $true -or
              $health.result.updatePending -ne $false -or
              $health.result.phase -ne "production_ready" -or
              $health.result.executionAuthority -ne "service" -or
              $health.result.claimsEnabled -ne $true) {
            throw "RELEASE_FIXTURE_UPDATE_HEALTH_FAILED"
          }
          $controlBackupsBefore = @(
            Get-ChildItem (Join-Path $data "control-backups") -File
          ).Count
          & (Join-Path $root "scripts\uninstall.ps1") `
            -ExpectedSignerThumbprint $expectedSigner
          & sc.exe query DbBackupService 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "RELEASE_FIXTURE_UNINSTALL_SERVICE_REMAINS"
          }
          if (-not (Test-Path -LiteralPath $data -PathType Container) -or
              $controlBackupsBefore -lt 1 -or
              $bundles.Count -lt 1) {
            throw "RELEASE_FIXTURE_UNINSTALL_DATA_LOSS"
          }
          $evidence = [ordered] @{
            schemaVersion = 1
            status = "pass"
            trustContext = "same_artifact_lifecycle_fixture_not_production_trust"
            sourceRevision = $metadata.sourceRevision
            sourceTreeDigest = $metadata.sourceTreeDigest
            buildId = $metadata.buildId
            signerThumbprint = $metadata.signerThumbprint
            deploymentScriptAuthenticode = "pass"
            cleanInstall = "pass"
            repair = "pass"
            update = "pass"
            supportBundle = "pass"
            uninstallPreservation = "pass"
            packageManifestSha256 = $metadata.packageManifestSha256
            serviceBinarySha256 = $metadata.serviceBinarySha256
            cliBinarySha256 = $metadata.cliBinarySha256
          }
          New-Item artifacts\release-fixture -ItemType Directory -Force |
            Out-Null
          $evidence | ConvertTo-Json -Depth 8 |
            Set-Content artifacts\release-fixture\evidence.json -Encoding UTF8
      - name: Upload clean fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-fixture-${{ github.run_id }}
          path: artifacts/release-fixture
          if-no-files-found: error
          retention-days: 90

  final-release-reevaluation:
    name: Bind qualification, signed package, and pristine lifecycle evidence
    needs: [managed-evidence, signed-package, clean-windows-fixture, artifact-functional-qualification]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download managed G5 qualification evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: managed-release-evidence-${{ github.run_id }}
          path: artifacts
      - name: Download exact signed package
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dbbackup-signed-candidate-${{ github.run_id }}
          path: artifacts/signed-release
      - name: Download pristine lifecycle fixture evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-fixture-${{ github.run_id }}
          path: artifacts/release-fixture
      - name: Download exact artifact functional evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifact-functional-${{ github.run_id }}
          path: artifacts/artifact-functional
      - name: Reevaluate deployment and promotion readiness
        shell: powershell
        run: >
          .\scripts\test-release-matrix.ps1
          -RequireUpstreamEvidence
          -RequirePromotionEvidence
          -QualificationEvidencePath artifacts/g5/release-matrix.json
          -SigningMetadataPath artifacts/signed-release/signing-metadata.json
          -SignedPackageManifestPath artifacts/signed-release/package/package-manifest.json
          -SignedFixtureEvidencePath artifacts/release-fixture/evidence.json
          -ArtifactFunctionalEvidencePath artifacts/artifact-functional/evidence.json
          -OutputRoot artifacts/promotion-reevaluation
      - name: Upload machine-readable final reevaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-reevaluation-${{ github.run_id }}
          path: artifacts/promotion-reevaluation
          if-no-files-found: error
          retention-days: 90

  publish-signed-package:
    name: Publish evaluated signed candidate package
    needs: [signed-package, final-release-reevaluation]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dbbackup-signed-candidate-${{ github.run_id }}
          path: dist/release
      - name: Upload evaluated signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbbackup-signed-windows-${{ needs.signed-package.outputs.version }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90
