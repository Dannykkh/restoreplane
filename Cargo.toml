# Cargo.toml (workspace root)
[workspace]
resolver = "2"
members = [
  "crates/dbbackup-core",
  "crates/dbbackup-config",
  "crates/dbbackup-cli",
  "crates/dbbackup-secrets",
  "crates/dbbackup-pipeline",
  "crates/dbbackup-source-pg",
  "crates/dbbackup-catalog",
  "crates/dbbackup-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
