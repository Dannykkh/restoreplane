# Cargo.toml (workspace root)
[workspace]
resolver = "2"
members = [
  "crates/dbbackup-core",
  "crates/dbbackup-config",
  "crates/dbbackup-cli",
  "crates/dbbackup-secrets",
  "crates/dbbackup-pipeline",
  "crates/dbbackup-dest-s3",
  "crates/dbbackup-dest-ssh",
  "crates/dbbackup-source-pg",
  "crates/dbbackup-source-mysql",
  "crates/dbbackup-source-sqlserver",
  "crates/dbbackup-source-sqlite",
  "crates/dbbackup-catalog",
  "crates/dbbackup-domain",
  "crates/dbbackup-application",
  "crates/dbbackup-runtime",
  "crates/dbbackup-service",
  "crates/dbbackup-ipc-client",
  "crates/dbbackup-verify",
  "crates/dbbackup-scheduler",
  "apps/console/src-tauri",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
