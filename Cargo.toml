# Cargo.toml (workspace root)
[workspace]
resolver = "2"
members = [
  "crates/restoreplane-core",
  "crates/restoreplane-config",
  "crates/restoreplane-cli",
  "crates/restoreplane-secrets",
  "crates/restoreplane-pipeline",
  "crates/restoreplane-dest-s3",
  "crates/restoreplane-dest-ssh",
  "crates/restoreplane-source-pg",
  "crates/restoreplane-source-mysql",
  "crates/restoreplane-source-sqlserver",
  "crates/restoreplane-source-sqlite",
  "crates/restoreplane-catalog",
  "crates/restoreplane-domain",
  "crates/restoreplane-application",
  "crates/restoreplane-runtime",
  "crates/restoreplane-service",
  "crates/restoreplane-ipc-client",
  "crates/restoreplane-verify",
  "crates/restoreplane-scheduler",
  "apps/console/src-tauri",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Dannykkh/restoreplane"
publish = false

[workspace.dependencies]
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
semver = "1"
anyhow = "1"
thiserror = "1"
base64 = "0.22"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
