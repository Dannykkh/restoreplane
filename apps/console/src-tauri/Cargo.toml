[package]
name = "restoreplane-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "RestorePlane management GUI (Tauri desktop console)"

# GUI 백엔드는 기존 lib 크레이트를 직접 의존해 재사용한다(재구현 금지).
# 읽기/대시보드는 config + catalog 직접 조회, 액션은 restoreplane.exe 사이드카(후속 증분).

[lib]
name = "restoreplane_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
serde = { workspace = true }
async-trait = "0.1"
uuid = { version = "=1.11.0", features = ["v4"] }
zeroize = "=1.9.0"
blake3 = "=1.5.5"
tokio = { version = "=1.53.3", features = ["sync", "rt"] }

restoreplane-application = { path = "../../../crates/restoreplane-application" }
restoreplane-ipc-client = { path = "../../../crates/restoreplane-ipc-client" }
restoreplane-domain = { path = "../../../crates/restoreplane-domain" }
restoreplane-workbench = { path = "../../../crates/restoreplane-workbench" }
restoreplane-service = { path = "../../../crates/restoreplane-service" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell"] }
