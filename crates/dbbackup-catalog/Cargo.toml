[package]
name = "dbbackup-catalog"
version.workspace = true
edition.workspace = true

# S08 — Catalog(SQLite 로컬 캐시) + Manifest rebuild/서명 게이트.
# 랜섬웨어 전제(H5/P0-6): 로컬 SQLite는 신뢰 불가 캐시. 진실 소스는 목적지에 동봉된 서명 매니페스트.
# 파이프라인(dbbackup-pipeline)의 Manifest/SignedManifest/ed25519 서명을 재사용한다(병렬 매니페스트 금지).

[dependencies]
dbbackup-core = { path = "../dbbackup-core" }
dbbackup-pipeline = { path = "../dbbackup-pipeline" }

# SQLite: bundled로 시스템 sqlite 불필요(Windows 배포 단순화).
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { workspace = true }
serde_json = "1"
blake3 = "=1.5.5"
uuid = { version = "=1.11.0", features = ["v4"] }
ed25519-dalek = { version = "=2.2.0" }

# overlap guard 1차 방어(OS 네임드 뮤텍스, 크로스플랫폼).
named-lock = "0.4"

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
dbbackup-secrets = { path = "../dbbackup-secrets" }
tempfile = "=3.14.0"
