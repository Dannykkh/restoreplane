[package]
name = "dbbackup-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dbbackup"
path = "src/main.rs"

[dependencies]
dbbackup-core = { path = "../dbbackup-core" }
dbbackup-config = { path = "../dbbackup-config" }
dbbackup-pipeline = { path = "../dbbackup-pipeline" }
dbbackup-source-pg = { path = "../dbbackup-source-pg" }
dbbackup-secrets = { path = "../dbbackup-secrets" }
dbbackup-catalog = { path = "../dbbackup-catalog" }
dbbackup-verify = { path = "../dbbackup-verify" }
clap.workspace = true
anyhow.workspace = true
serde_json = "1"
rpassword.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros"] }
zeroize = { version = "=1.8.1" }
