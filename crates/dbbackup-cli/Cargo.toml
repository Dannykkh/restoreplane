[package]
name = "dbbackup-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dbbackup"
path = "src/main.rs"

[dependencies]
dbbackup-core = { path = "../dbbackup-core" }
dbbackup-config = { path = "../dbbackup-config" }
dbbackup-pipeline = { path = "../dbbackup-pipeline" }
dbbackup-dest-s3 = { path = "../dbbackup-dest-s3" }
dbbackup-dest-ssh = { path = "../dbbackup-dest-ssh" }
dbbackup-source-pg = { path = "../dbbackup-source-pg" }
dbbackup-source-mysql = { path = "../dbbackup-source-mysql" }
dbbackup-secrets = { path = "../dbbackup-secrets" }
dbbackup-catalog = { path = "../dbbackup-catalog" }
dbbackup-verify = { path = "../dbbackup-verify" }
dbbackup-scheduler = { path = "../dbbackup-scheduler" }
clap.workspace = true
anyhow.workspace = true
serde_json = "1"
rpassword.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros"] }
time = { version = "0.3", features = ["std"] }
zeroize = { version = "=1.9.0" }
ed25519-dalek = { version = "=2.2.0" }

[dev-dependencies]
tempfile = "=3.14.0"
