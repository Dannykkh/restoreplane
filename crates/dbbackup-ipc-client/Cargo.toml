[package]
name = "dbbackup-ipc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dbbackup-application = { path = "../dbbackup-application" }
dbbackup-domain = { path = "../dbbackup-domain" }
dbbackup-service = { path = "../dbbackup-service" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "=1.52.3", features = ["rt", "time"] }

[dev-dependencies]
dbbackup-catalog = { path = "../dbbackup-catalog" }
tempfile = "=3.14.0"
uuid = { version = "=1.11.0", features = ["v4"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
