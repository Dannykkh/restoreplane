[package]
name = "dbbackup-secrets"
version.workspace = true
edition.workspace = true

# S02 — SecretManager: 봉투암호화(DEK/KEK) + ed25519 서명 + 복구코드.
# 보안 핵심 크레이트는 정확 버전(=)으로 핀해 공급망 드리프트를 막는다(S11 정합).

[dependencies]
dbbackup-core = { path = "../dbbackup-core" }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = "1"

# --- 보안 핵심(정확 버전 핀) ---
argon2 = "=0.5.3"
chacha20poly1305 = { version = "=0.10.1", features = ["stream"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
zeroize = { version = "=1.8.1", features = ["derive"] }
rand = "=0.8.5"
hkdf = "=0.12.4"
sha2 = "=0.10.8"
data-encoding = "=2.6.0"

# DPAPI는 Windows에서만 링크(비Windows는 비번/복구코드 경로만 컴파일).
[target.'cfg(windows)'.dependencies]
windows-dpapi = "=0.2.0"
