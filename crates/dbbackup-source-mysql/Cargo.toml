[package]
name = "dbbackup-source-mysql"
version.workspace = true
edition.workspace = true

# S04 — BackupSource + MySqlSource. mysqldump을 tokio::process로 구동한다. MySQL/MariaDB의
# 두 배포판(Oracle MySQL, MariaDB) 축을 별도 매트릭스로 분리하고, 덤프 실행 전 엔진 스캔으로
# 비-InnoDB 테이블(MyISAM 비일관 위험)을 매니페스트에 기록한다.
# 런타임에는 실제 MySQL이 필요하지만, 버전/매트릭스/flags/엔진분류/앵커 로직은 순수 함수라
# DB 없이 유닛 테스트한다. source-pg와 구조적으로 평행하다.
#
# 편차(section-S04.md의 Reference Libraries 대비): sqlx / regex / once_cell 을 도입하지 않는다.
# - "번들 heavy dep 최소화" 제약에 맞춰, 런타임 메타 조회는 MySqlMetaConn 트레이트로 추상화하고
#   (섹션의 Risk & Rollback가 명시한 seam), 구체 구현은 tokio::process 기반 `mysql` CLI 조회로 둔다.
# - 버전 접두 파싱은 regex 대신 수동 파서(parse_semver_prefix)로 처리한다(source-pg의 parse_version_major와 동일 취지).

[dependencies]
dbbackup-pipeline = { path = "../dbbackup-pipeline" }
dbbackup-core = { path = "../dbbackup-core" }

tokio = { version = "=1.44.2", features = ["process", "io-util", "rt-multi-thread", "macros"] }
async-trait = "0.1"
uuid = { version = "=1.11.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "=1.8.1", features = ["derive"] }
futures = "=0.3.31"
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
