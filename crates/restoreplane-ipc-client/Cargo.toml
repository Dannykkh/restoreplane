[package]
name = "restoreplane-ipc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
restoreplane-application = { path = "../restoreplane-application" }
restoreplane-domain = { path = "../restoreplane-domain" }
restoreplane-service = { path = "../restoreplane-service" }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { version = "=1.53.3", features = ["rt", "time"] }

[dev-dependencies]
restoreplane-catalog = { path = "../restoreplane-catalog" }
tempfile = "=3.14.0"
uuid = { version = "=1.11.0", features = ["v4"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync"] }
