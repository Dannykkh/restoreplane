[package]
name = "restoreplane-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
blake3 = "=1.5.5"
base64 = { workspace = true }
restoreplane-application = { path = "../restoreplane-application" }
restoreplane-catalog = { path = "../restoreplane-catalog" }
restoreplane-core = { path = "../restoreplane-core" }
restoreplane-dest-s3 = { path = "../restoreplane-dest-s3" }
restoreplane-dest-ssh = { path = "../restoreplane-dest-ssh" }
restoreplane-domain = { path = "../restoreplane-domain" }
restoreplane-pipeline = { path = "../restoreplane-pipeline" }
restoreplane-runtime = { path = "../restoreplane-runtime" }
restoreplane-scheduler = { path = "../restoreplane-scheduler" }
restoreplane-secrets = { path = "../restoreplane-secrets" }
restoreplane-source-mysql = { path = "../restoreplane-source-mysql" }
restoreplane-source-pg = { path = "../restoreplane-source-pg" }
restoreplane-source-sqlite = { path = "../restoreplane-source-sqlite" }
ed25519-dalek = "=2.2.0"
fs2 = "=0.4.3"
sha2 = "=0.10.8"
serde = { workspace = true }
serde_json = "1"
semver = { workspace = true }
rand = "=0.8.5"
subtle = "=2.6.1"
tar = "=0.4.45"
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { version = "=1.11.0", features = ["v4"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
zstd = "=0.13.3"
tokio = { version = "=1.52.3", features = ["io-util", "net", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
restoreplane-config = { path = "../restoreplane-config" }
tempfile = "=3.14.0"

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
