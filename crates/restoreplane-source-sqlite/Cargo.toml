[package]
name = "restoreplane-source-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
blake3 = "=1.5.5"
restoreplane-core = { path = "../restoreplane-core" }
restoreplane-pipeline = { path = "../restoreplane-pipeline" }
fs2 = "=0.4.3"
futures = "=0.3.31"
rusqlite = { version = "=0.41.0", default-features = false, features = ["cache", "backup", "bundled", "hooks"] }
serde = { workspace = true }
tempfile = "=3.14.0"
thiserror = { workspace = true }
tokio = { version = "=1.53.3", features = ["fs", "io-util", "rt", "sync"] }
uuid = { version = "=1.11.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
serde_json = "1"
